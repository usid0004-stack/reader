(async function(){ const out = []; try { out.push('text: ' + JSON.stringify(TextService.segmentSentences('One. Two!').map(s=>s.text))); } catch(e){ out.push('text ERROR ' + e.message); }
try { await DocumentStorageService.check(); out.push('indexeddb: ok'); } catch(e){ out.push('indexeddb ERROR ' + e.message); }

window.addEventListener('error', e => { document.getElementById('out').textContent += ' · window error: ' + e.message; });
